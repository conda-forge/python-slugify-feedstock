# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "9.1.3"
  python_check_max: "3.15"
  summary: A Python slugify application that also handles Unicode
  cov_run: coverage run --source=slugify --branch --append

recipe:
  name: python-slugify-split
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/python-slugify/python_slugify-${{ version }}.tar.gz
  sha256: 90e997f2e0987239ce95e12f700086eb18e1d1d3ee22624fbbdbd095afca42b6

build:
  number: 0

outputs:
  - package:
      name: python-slugify
    build:
      number: 0
      noarch: python
      script:
        - ${{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation --disable-pip-version-check --check-build-dependencies
      python:
        entry_points:
          - slugify = slugify.__main__:main
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - setuptools >=77
      run:
        - python >=${{ python_min }}
        - text-unidecode >=1.3
      run_constraints:
        # avoid these packages with conflicts in `site-packages/slugify`
        - awesome-slugify <0
        - slugify <0
        # [anyascii]
        - anyascii >=0.3.2
        # [unidecode]
        - unidecode >=1.1.1
    tests:
      - package_contents:
          strict: true
          site_packages:
            - slugify/**
            - python_slugify-${{ version }}.dist-info/**
      - python:
          imports: slugify
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
      - script:
          - slugify --help

  - package:
      name: python-slugify-with-unidecode
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("python-slugify", exact=True) }}
        - unidecode
    tests:
      - python:
          imports: slugify
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
      - files:
          source:
            - tests/**
            - tools/**
            - README.md
        requirements:
          run:
            - pytest-cov
            - python ${{ python_min }}.*
            # anyascii only tested until testing/documentaiton for CEP-44 is resolved
            - anyascii
            - pip
        script:
          - pip check
          - slugify --help
          # check dynamic version
          - python -c "import slugify; assert slugify.__version__ == '${{ version }}'"
          - ${{ cov_run }} -m slugify.__main__ --help
          - ${{ cov_run }} -m pytest -vv --tb=long --color=yes
          - coverage report --show-missing --skip-covered --fail-under=99
    about:
      summary: ${{ summary }} (with [unidecode])

about:
  license: MIT
  license_file: LICENSE
  summary: ${{ summary }}
  homepage: https://pypi.org/project/python-slugify
  repository: https://github.com/un33k/python-slugify

extra:
  feedstock-name: python-slugify
  recipe-maintainers:
    - proinsias
    - sodre
    - bollwyvl
