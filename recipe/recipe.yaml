# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "9.1.3"
  python_check_max: "3.14"

recipe:
  name: python-slugify-split
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/p/python-slugify/python_slugify-${{ version }}.tar.gz
    sha256: 90e997f2e0987239ce95e12f700086eb18e1d1d3ee22624fbbdbd095afca42b6

build:
  number: 0

outputs:
  - package:
      name: python-slugify
    build:
      number: 0
      noarch: python
      script:
        - ${{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation --disable-pip-version-check
      python:
        entry_points:
          - slugify = slugify.__main__:main
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - setuptools >=77
      run:
        - python >=${{ python_min }}
        - text-unidecode >=1.3
      run_constraints:
        # avoid these packages with conflicts in `site-packages/slugify`
        - awesome-slugify <0
        - slugify <0
        # [anyascii]
        - anyascii >=0.3.2
        # [unidecode]
        - unidecode >=1.1.1
    tests:
      - python:
          imports: slugify
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
      - files:
          source:
            - tests/
            - tools/
            - README.md
        requirements:
          run:
            - pytest-cov
            - python ${{ python_min }}.*
        script:
          - slugify --help
          - pytest -vvv tests/

  - package:
      name: python-slugify-with-unidecode
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("python-slugify", exact=True) }}
        - unidecode
    tests:
      - python:
          imports: slugify
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
      - files:
          source:
            - tests/
            - tools/
            - README.md
        requirements:
          run:
            - pytest-cov
            - python ${{ python_min }}.*
        script:
          - slugify --help
          - pytest -vvv tests/

about:
  license: MIT
  license_file: LICENSE
  summary: A Python slugify application that also handles Unicode
  homepage: https://pypi.org/project/python-slugify
  repository: https://github.com/un33k/python-slugify

extra:
  feedstock-name: python-slugify
  recipe-maintainers:
    - proinsias
    - sodre
    - bollwyvl
